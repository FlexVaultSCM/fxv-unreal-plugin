name: Draft Discord Release to Staging

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to draft (e.g. v0.3.0). Leave blank for latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  draft-discord-release:
    name: Post Release Draft to Discord
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage Discord Release Announcement
        uses: FlexVaultSCM/discord-release-action@v1
        with:
          webhook-url: ${{ secrets.DISCORD_STAGING_WEBHOOK }}
          from-gh-release: ${{ github.event.inputs.tag || github.event.release.tag_name || '' }}
          product-name: 'FlexVault Unreal Plugin'
          docs-url: 'https://docs.fxv.dev/how-to/unreal-plugin'
