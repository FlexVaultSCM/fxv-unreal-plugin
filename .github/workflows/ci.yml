name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plugin:
    name: Validate Plugin & Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate version consistency
        run: node .github/scripts/validate-versions.js

      - name: Validate .uplugin JSON descriptor
        run: |
          node -e "
            const fs = require('fs');
            const upluginPath = 'FlexVaultSourceControl/FlexVaultSourceControl.uplugin';
            if (!fs.existsSync(upluginPath)) {
              console.error('Missing uplugin descriptor at ' + upluginPath);
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync(upluginPath, 'utf8'));
            const requiredFields = ['FileVersion', 'Version', 'VersionName', 'FriendlyName', 'Modules'];
            for (const field of requiredFields) {
              if (data[field] === undefined) {
                console.error('Missing required uplugin field: ' + field);
                process.exit(1);
              }
            }
            if (!Array.isArray(data.Modules) || data.Modules.length === 0) {
              console.error('uplugin Modules must be a non-empty array');
              process.exit(1);
            }
            console.log('Valid .uplugin descriptor for ' + data.FriendlyName + ' v' + data.VersionName);
          "

      - name: Verify source file structure
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const requiredFiles = [
              'FlexVaultSourceControl/FlexVaultSourceControl.uplugin',
              'FlexVaultSourceControl/Source/FlexVaultSourceControl/FlexVaultSourceControl.Build.cs',
              'FlexVaultSourceControl/Source/FlexVaultSourceControl/Private/FlexVaultSourceControlModule.cpp'
            ];
            for (const req of requiredFiles) {
              if (!fs.existsSync(req)) {
                console.error('Missing required plugin file: ' + req);
                process.exit(1);
              }
            }
            console.log('All required source files present.');
          "

      - name: Package source-only plugin bundle for Fab
        run: |
          version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('FlexVaultSourceControl/FlexVaultSourceControl.uplugin')).VersionName)")
          fab_bundle="FlexVaultSourceControl-${version}-Fab.zip"
          git archive --format=zip --prefix="FlexVaultSourceControl/" HEAD:FlexVaultSourceControl -o "$fab_bundle"
          test -s "$fab_bundle"
          sha256sum "$fab_bundle"
          echo "FAB_BUNDLE=$fab_bundle" >> "$GITHUB_ENV"
          echo "FAB_ARTIFACT=FlexVaultSourceControl-${version}-Fab" >> "$GITHUB_ENV"

      - name: Upload Fab source bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FAB_ARTIFACT }}
          path: ${{ env.FAB_BUNDLE }}
          if-no-files-found: error
          retention-days: 14
